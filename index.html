<body data-theme="liquid" data-font="sans">
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brandmark">◈</div><div><div class="brandname">Liquid<span>Journal</span></div><div class="brand-sub">A little space for everything you are.</div></div></div>
    <div class="top-actions">
      <button class="soft-btn" id="installApp" title="Install LiquidJournal" aria-label="Install LiquidJournal"><span>⇩</span> Install</button>
      <button class="soft-btn" id="quickSearch" title="Search entries"><span>⌕</span> Search</button>
      <button class="icon-btn" id="themeQuick" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
      <button class="icon-btn" id="settingsQuick" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar glass">
      <button class="primary new-entry" id="newEntry"><span>＋</span> &nbsp; New entry</button>
      <div class="nav-label">Workspace</div>
      <button class="nav-item active" data-view="home"><span class="ico">⌂</span> Overview</button>
      <button class="nav-item" data-view="entries"><span class="ico">▤</span> All entries <span class="count" id="sideCount">0</span></button>

      <button class="nav-item" data-view="calendar"><span class="ico">▦</span> Calendar</button>
      <div class="nav-label">Your space</div>
      <button class="nav-item" data-view="prompts"><span class="ico">✧</span> Writing prompts</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<script>
(() => {
'use strict';
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>[...root.querySelectorAll(s)];
const KEY='liquidjournal.v1';
const nowISO=()=>new Date().toISOString();
const dateKey=(d=new Date())=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const prettyDate=(d,opts={month:'short',day:'numeric',year:'numeric'})=>new Date(d).toLocaleDateString(undefined,opts);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const prompts=[
  {title:'A small win',text:'What is one small thing you did today that deserves more credit than you gave it?'},
  {title:'Mind like water',text:'What has been taking up space in your mind? Write it down without trying to solve it yet.'},
  {title:'Future you',text:'Imagine yourself one year from now. What would that version of you thank you for starting today?'},
  {title:'The unexpected',text:'What surprised you recently, and what did it reveal about you?'},
  {title:'Let it go',text:'What is one thing you can stop carrying today? What would feel different without it?'},
  {title:'A moment worth keeping',text:'Describe a moment you wish you could pause and keep in a little glass jar.'},
  {title:'Three truths',text:'Write three things that are true for you right now, without judging any of them.'},
  {title:'Curiosity hour',text:'What question have you been curious about lately? Follow the thought wherever it goes.'}
];
const starter=()=>({entries:[],settings:{theme:'liquid',font:'sans',size:16,autosave:true,showWordCount:true,compact:false}});
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||starter()}catch{state=starter()}
if(!state.entries)state.entries=[];if(!state.settings)state.settings=starter().settings;
let view='home',currentId=null,saveTimer=null,filterQuery='',calendarMonth=new Date().getMonth(),calendarYear=new Date().getFullYear(),activeMood='🙂',editorTags=[];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));updateCounts()}catch(e){toast('Storage is full. Export your entries and remove older backups.');}}
function updateCounts(){$('#sideCount').textContent=state.entries.length}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2300)}
function applySettings(){document.body.dataset.theme=state.settings.theme||'liquid';document.body.dataset.font=state.settings.font||'sans';document.documentElement.style.setProperty('--editor-size',(state.settings.size||16)+'px');}
applySettings();
const iconMood={'😊':'Happy','🙂':'Okay','😌':'Calm','🤩':'Excited','😔':'Low','😤':'Frustrated','😰':'Anxious','🥰':'Grateful'};
function wordCount(s){return (s.trim().match(/\S+/g)||[]).length}
function excerpt(s,n=150){return s.replace(/\s+/g,' ').trim().slice(0,n)+(s.trim().length>n?'…':'')}
function render(){
  applySettings();updateCounts();
  $$('.nav-item,.mobile-nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  const main=$('#main');
  if(view==='home')main.innerHTML=homeHTML();
  else if(view==='entries')main.innerHTML=entriesHTML('all');
  else if(view==='favorites')main.innerHTML=entriesHTML('favorites');
  else if(view==='editor')main.innerHTML=editorHTML();
  else if(view==='settings')main.innerHTML=settingsHTML();
  else if(view==='prompts')main.innerHTML=promptsHTML();
  else if(view==='calendar')main.innerHTML=calendarHTML();
  bindMain();
}
function entryCard(e){return `<article class="entry-card" data-open="${e.id}" tabindex="0" role="button" aria-label="Open ${esc(e.title||'Untitled entry')}"><div class="entry-top"><span class="entry-date">${prettyDate(e.date||e.updatedAt,{month:'short',day:'numeric',year:'numeric'})}</span><span class="mood" title="${iconMood[e.mood]||'Mood'}">${e.mood||'🙂'}</span></div><div class="entry-title">${esc(e.title||'Untitled entry')}</div><div class="entry-preview">${esc(excerpt(e.body||'No words yet.'))}</div><div class="entry-footer">${(e.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span class="wordcount">${wordCount(e.body||'')} words</span>${e.favorite?'<span title="Favorite">♡</span>':''}</div></article>`}
function emptyHTML(title,desc,button='Write your first entry'){return `<div class="empty"><div class="empty-icon">✧</div><strong>${title}</strong><p>${desc}</p><button class="primary" id="emptyCreate">${button}</button></div>`}
function homeHTML(){
 const entries=[...state.entries].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
 const today=entries.filter(e=>dateKey(e.date||e.updatedAt)===dateKey()).length;
 const weekDays=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);weekDays.push(d)}
 const written=new Set(entries.map(e=>dateKey(e.date||e.updatedAt)));
 let streak=0;for(let d=new Date();written.has(dateKey(d));d.setDate(d.getDate()-1))streak++;
 const dayNames=['S','M','T','W','T','F','S'];
 return `<section class="welcome"><div><div class="eyebrow">YOUR PERSONAL SPACE</div><h1>Make room for your thoughts.</h1><p>A quiet place to reflect, untangle ideas, and notice your growth.</p></div><div class="date-pill">✧ &nbsp; ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div></section>
 <section class="stats"><div class="stat glass"><div class="stat-label">Your entries</div><div class="stat-num">${entries.length}</div><div class="stat-note">Every thought counts</div></div><div class="stat glass"><div class="stat-label">Words collected</div><div class="stat-num">${entries.reduce((n,e)=>n+wordCount(e.body||''),0).toLocaleString()}</div><div class="stat-note">Your story, one word at a time</div></div><div class="stat glass"><div class="stat-label">Entries today</div><div class="stat-num">${today}</div><div class="stat-note">${today?'You showed up for yourself':'A fresh page is waiting'}</div></div></section>
 <section class="content-grid"><div class="panel glass"><div class="panel-head"><h2>Recently written</h2><button class="text-link" data-goto="entries">View all →</button></div><div class="entry-list">${entries.length?entries.slice(0,4).map(entryCard).join(''):emptyHTML('Your story starts here','Capture a thought, a memory, or a moment from today. It does not need to be perfect.')}</div></div>
 <div class="right-stack"><div class="panel glass quote-card"><div class="quote-mark">“</div><div class="quote-text" id="dailyQuote">You do not have to understand everything today. Just begin where you are.</div><div class="quote-source">A gentle reminder · for you</div><div style="margin-top:18px"><button class="soft-btn" id="quoteRefresh">↻ Another thought</button></div></div>
 <div class="panel glass"><div class="panel-head"><h2>Your rhythm</h2><span class="muted" style="font-size:11px">Last 7 days</span></div><div class="streak-row"><div class="streak-icon">✦</div><div><strong>${streak}</strong><span>day streak · keep it gentle</span></div></div><div class="week">${weekDays.map(d=>`<div class="day"><span>${dayNames[d.getDay()]}</span><div class="day-dot ${written.has(dateKey(d))?'done':''}"></div></div>`).join('')}</div></div></div></section><div class="footer-note">Your thoughts are yours. LiquidJournal saves locally in this browser.</div>`;
}
function entriesHTML(mode){
 let entries=[...state.entries].filter(e=>mode==='favorites'?e.favorite:true).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
 const tags=[...new Set(state.entries.flatMap(e=>e.tags||[]))].sort();

}
function editorHTML(){
 const e=state.entries.find(x=>x.id===currentId)||{id:null,title:'',body:'',date:nowISO(),updatedAt:nowISO(),mood:activeMood,tags:[],favorite:false};

onMood[m]}" aria-label="${iconMood[m]}">${m}</button>`).join('')}</div><div class="field-label">Entry date</div><input class="field" type="date" id="entryDate" value="${dateKey(e.date)}"><div class="field-label">Tags</div><div class="tag-input"><input class="field" id="tagInput" placeholder="e.g. growth, school"><button class="soft-btn" id="addTag" style="padding:0 12px">＋</button></div><div id="tagList">${editorTags.map(t=>`<span class="tag-chip">${esc(t)} <button data-remove-tag="${esc(t)}" style="border:0;background:none;color:inherit;padding:0">×</button></span>`).join('')}</div></div><div class="mini-panel glass"><h3>Page actions</h3><button class="primary" id="saveEntry" style="width:100%">Save entry</button><button class="soft-btn" id="exportSingle" style="width:100%;margin-top:10px">↓ Export as text</button>${currentId?'<button class="soft-btn danger" id="deleteEntry" style="width:100%;margin-top:10px">Delete entry</button>':''}<div class="small" style="margin-top:13px">Your writing is stored in this browser. Export a backup before clearing browser data.</div></div></aside></div>`;
}
function settingsHTML(){
 const themes=[['liquid','Liquid Glass','linear-gradient(135deg,#a8fff0,#a4a3ff,#ffc0df)'],['light','Cloud','linear-gradient(135deg,#f6f8fc,#dce3ed)'],['dark','Obsidian','linear-gradient(135deg,#12131c,#3a3d53)'],['lavender','Lavender','linear-gradient(135deg,#e9dcff,#b9a3ff)'],['midnight','Midnight','linear-gradient(135deg,#0e1c30,#365c85)'],['rose','Rosewater','linear-gradient(135deg,#ffe3ef,#e8a8c3)'],['mono','Monochrome','linear-gradient(135deg,#f5f5f5,#767d88)']];
 return `<section class="view-header"><div><div class="eyebrow">MAKE IT FEEL LIKE YOURS</div><h1>Personalize</h1><p class="muted" style="font-size:13px;margin:0">Tune your writing space to match your mood.</p></div></section><div class="settings-grid"><section class="setting-card glass"><h3>✧ Choose a theme</h3><p>Soft glass, quiet dark, or a little colour. Switch whenever you like.</p><div class="theme-options">${themes.map(([id,name,bg])=>`<button class="theme-swatch ${state.settings.theme===id?'active':''}" data-theme-pick="${id}" style="background:${bg}" title="${name}" aria-label="${name}"><span style="color:${id==='dark'||id==='midnight'?'white':'#30313a'}">${name}</span></button>`).join('')}</div><div class="small" style="margin-top:12px">Selected: ${themes.find(t=>t[0]===state.settings.theme)?.[1]||'Liquid Glass'}</div></section><section class="setting-card glass"><h3>Aa Typography</h3><p>Choose a typeface that makes your words feel natural to read.</p><label class="field-label">Writing font</label><select class="select-wide" id="fontSelect"><option value="sans" ${state.settings.font==='sans'?'selected':''}>DM Sans · Clean & friendly</option><option value="manrope" ${state.settings.font==='manrope'?'selected':''}>Manrope · Modern & crisp</option><option value="playfair" ${state.settings.font==='playfair'?'selected':''}>Playfair Display · Editorial</option><option value="mono" ${state.settings.font==='mono'?'selected':''}>JetBrains Mono · Focus mode</option></select><div class="font-preview" id="fontPreview">Your thoughts deserve room to breathe.</div><label class="field-label">Writing size · <span id="sizeLabel">${state.settings.size||16}px</span></label><input type="range" min="14" max="22" value="${state.settings.size||16}" id="fontSize" style="width:100%;accent-color:var(--accent)"></section><section class="setting-card glass"><h3>✦ Writing preferences</h3><p>Keep the experience comfortable and distraction-free.</p><div class="toggle-row"><span>Autosave while writing</span><input class="toggle" type="checkbox" id="autosaveToggle" ${state.settings.autosave?'checked':''}></div><div class="toggle-row"><span>Show word count</span><input class="toggle" type="checkbox" id="wordToggle" ${state.settings.showWordCount?'checked':''}></div><div class="toggle-row"><span>Compact entry cards</span><input class="toggle" type="checkbox" id="compactToggle" ${state.settings.compact?'checked':''}></div></section><section class="setting-card glass"><h3>↗ Your data, your choice</h3><p>LiquidJournal currently stores entries only in this browser. Keep a backup or move your writing to another device.</p><button class="soft-btn" id="exportBackup" style="width:100%;margin-bottom:9px">↓ Export all entries (.json)</button><button class="soft-btn" id="exportMarkdown" style="width:100%;margin-bottom:9px">↓ Export as Markdown</button><label class="soft-btn" for="importFile" style="width:100%;cursor:pointer">↑ Import backup (.json)</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"><div class="divider"></div><button class="soft-btn danger" id="clearAll" style="width:100%">Clear all journal data</button><p class="small" style="margin-top:12px">No account or cloud sync is configured. Avoid using a shared device for private entries.</p></section></div><div class="footer-note">LiquidJournal · Crafted for clarity, calm, and consistency.</div>`;
}
function promptsHTML(){return `<section class="view-header"><div><div class="eyebrow">WHEN THE PAGE FEELS EMPTY</div><h1>Writing prompts</h1><p class="muted" style="font-size:13px;margin:0">A small nudge, never a rule. Choose one and make it yours.</p></div></section><div class="entries-page-grid">${prompts.map((p,i)=>`<article class="panel glass"><div style="font-size:22px;margin-bottom:12px">${['✧','☁','↗','✦','❋','◈','◎','⌕'][i]}</div><h2 style="margin-bottom:9px">${p.title}</h2><p class="muted" style="font-size:13px;line-height:1.7;min-height:62px">${p.text}</p><button class="soft-btn use-prompt" data-prompt="${i}">Write about this →</button></article>`).join('')}</div>`}
function calendarHTML(){
 const first=new Date(calendarYear,calendarMonth,1),days=new Date(calendarYear,calendarMonth+1,0).getDate(),offset=first.getDay();
 const byDay={};state.entries.forEach(e=>{const k=dateKey(e.date||e.updatedAt);byDay[k]=(byDay[k]||0)+1});
 let cells='';for(let i=0;i<offset;i++)cells+='<div></div>';
 for(let d=1;d<=days;d++){const k=dateKey(new Date(calendarYear,calendarMonth,d));const n=byDay[k]||0;cells+=`<button class="calendar-day ${n?'has-entry':''} ${k===dateKey()?'today':''}" data-calendar-date="${k}" title="${n} entr${n===1?'y':'ies'}">${d}${n?`<span>${n}</span>`:''}</button>`}
 return `<section class="view-header"><div><div class="eyebrow">YOUR JOURNAL, OVER TIME</div><h1>Calendar</h1><p class="muted" style="font-size:13px;margin:0">See the days you made time for yourself.</p></div><button class="primary" id="newFromList">＋ Write</button></section><section class="panel glass"><div class="panel-head"><button class="icon-btn" id="prevMonth" aria-label="Previous month">‹</button><h2>${new Date(calendarYear,calendarMonth,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="icon-btn" id="nextMonth" aria-label="Next month">›</button></div><div class="calendar-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="calendar-weekday">${d}</div>`).join('')}${cells}</div><div class="divider"></div><p class="small">Coloured days have entries. Select a date to view or write.</p><div id="calendarResults"></div></section><style>.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.calendar-weekday{text-align:center;font-size:11px;color:var(--muted);padding:10px 0}.calendar-day{position:relative;min-height:66px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--text);font-weight:600}.calendar-day span{display:block;font-size:10px;color:var(--accent);margin-top:4px}.calendar-day.has-entry{background:linear-gradient(145deg,rgba(64,217,203,.17),rgba(119,105,237,.16));border-color:rgba(119,105,237,.3)}.calendar-day.today{outline:2px solid var(--accent);outline-offset:1px}@media(max-width:500px){.calendar-grid{gap:4px}.calendar-day{min-height:47px;border-radius:9px;font-size:12px}.calendar-weekday{font-size:9px}}</style>`;
}
function bindMain(){
 $$('[data-open]').forEach(el=>{const open=()=>openEditor(el.dataset.open);el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});
 $$('[data-goto]').forEach(b=>b.onclick=()=>navigate(b.dataset.goto));
 ['newFromList','emptyCreate'].forEach(id=>{const b=$('#'+id);if(b)b.onclick=()=>openEditor(null)});
 if(view==='entries'||view==='favorites'){
  const s=$('#entrySearch');if(s){s.oninput=()=>{filterQuery=s.value;const pos=s.selectionStart;const next=entriesHTML(view==='favorites'?'favorites':'all');const temp=document.createElement('div');temp.innerHTML=next;const fresh=$('#entriesGrid');const replacement=temp.querySelector('#entriesGrid');if(fresh&&replacement)fresh.replaceWith(replacement);bindCardsOnly();const ns=$('#entrySearch');if(ns){ns.focus();ns.setSelectionRange(pos,pos)};const sort=$('#sortEntries');if(sort)sort.onchange=sortHandler;const tag=$('#tagFilter');if(tag)tag.onchange=tagHandler;};}
  const sort=$('#sortEntries');if(sort)sort.onchange=sortHandler;const tag=$('#tagFilter');if(tag)tag.onchange=tagHandler;
 }
 function sortHandler(){const grid=$('#entriesGrid');let arr=[...state.entries].filter(e=>view!=='favorites'||e.favorite).filter(e=>(e.title+' '+e.body+' '+(e.tags||[]).join(' ')).toLowerCase().includes(filterQuery.toLowerCase()));const tag=$('#tagFilter')?.value;if(tag)arr=arr.filter(e=>(e.tags||[]).includes(tag));if(this.value==='old')arr.sort((a,b)=>new Date(a.date)-new Date(b.date));else if(this.value==='az')arr.sort((a,b)=>(a.title||'').localeCompare(b.title||''));else arr.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));grid.innerHTML=arr.length?arr.map(entryCard).join(''):emptyHTML('No entries found','Try another filter.');bindCardsOnly();}
 function tagHandler(){const tag=this.value;const grid=$('#entriesGrid');let arr=[...state.entries].filter(e=>view!=='favorites'||e.favorite).filter(e=>(e.title+' '+e.body+' '+(e.tags||[]).join(' ')).toLowerCase().includes(filterQuery.toLowerCase()));if(tag)arr=arr.filter(e=>(e.tags||[]).includes(tag));grid.innerHTML=arr.length?arr.map(entryCard).join(''):emptyHTML('No entries found','Try another filter.');bindCardsOnly();}
 if(view==='editor')bindEditor();
 if(view==='settings')bindSettings();
 if(view==='prompts')$$('.use-prompt').forEach(b=>b.onclick=()=>{openEditor(null,prompts[+b.dataset.prompt].text)});
 if(view==='calendar'){
  $('#prevMonth').onclick=()=>{calendarMonth--;if(calendarMonth<0){calendarMonth=11;calendarYear--}render()};
  $('#nextMonth').onclick=()=>{calendarMonth++;if(calendarMonth>11){calendarMonth=0;calendarYear++}render()};
  $$('[data-calendar-date]').forEach(b=>b.onclick=()=>{const k=b.dataset.calendarDate;const entries=state.entries.filter(e=>dateKey(e.date||e.updatedAt)===k);$('#calendarResults').innerHTML=`<h3 style="font:700 14px var(--heading-font);margin-top:18px">${prettyDate(k,{weekday:'long',month:'long',day:'numeric'})}</h3>${entries.length?`<div class="entry-list">${entries.map(entryCard).join('')}</div>`:`<p class="small">No entries for this day yet.</p>`}<button class="soft-btn" id="writeDate">＋ Write for this day</button>`;bindCardsOnly();$('#writeDate').onclick=()=>openEditor(null,'',k)});
 }
}
function bindCardsOnly(){$$('[data-open]').forEach(el=>{const fn=()=>openEditor(el.dataset.open);el.onclick=fn;el.onkeydown=e=>{if(e.key==='Enter')fn()}});const empty=$('#emptyCreate');if(empty)empty.onclick=()=>openEditor(null)}
function openEditor(id=null,body='',date=null){currentId=id;activeMood='🙂';editorTags=[];navigate('editor');if(body||date){const b=$('#entryBody'),d=$('#entryDate');if(b&&body)b.value=body;if(d&&date)d.value=date;updateEditorCount()}}
function navigate(v){view=v;filterQuery='';render();window.scrollTo({top:0,behavior:'smooth'})}
function getEditorData(){const old=state.entries.find(e=>e.id===currentId);return {id:currentId||uid(),title:$('#entryTitle')?.value.trim()||'Untitled entry',body:$('#entryBody')?.value||'',date:$('#entryDate')?.value?new Date($('#entryDate').value+'T12:00:00').toISOString():(old?.date||nowISO()),updatedAt:nowISO(),mood:activeMood,tags:[...editorTags],favorite:old?.favorite||false,createdAt:old?.createdAt||nowISO()}}
function saveEntry(leave=false){const data=getEditorData();if(!data.title.trim()&& !data.body.trim()){toast('Write a little something before saving.');return}const idx=state.entries.findIndex(e=>e.id===data.id);if(idx>=0)state.entries[idx]=data;else state.entries.push(data);currentId=data.id;persist();const status=$('#saveStatus');if(status)status.textContent='✓  Saved just now';if(leave){toast('Entry saved');navigate('entries')}else toast('Your thoughts are saved');}
function updateEditorCount(){const b=$('#entryBody');const el=$('#wordCount');if(el&&b)el.textContent=state.settings.showWordCount?`${wordCount(b.value)} words · ${b.value.length} characters`:''}
function bindEditor(){
 const title=$('#entryTitle'),body=$('#entryBody');const schedule=()=>{updateEditorCount();if(state.settings.autosave){$('#saveStatus').textContent='◌  Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const d=getEditorData();if(d.title!=='Untitled entry'||d.body.trim()){const i=state.entries.findIndex(e=>e.id===d.id);if(i>=0)state.entries[i]=d;else state.entries.push(d);currentId=d.id;persist();$('#saveStatus').textContent='✓  Saved automatically'}},650)}};
 title.oninput=schedule;body.oninput=schedule;
 $('#saveEntry').onclick=()=>saveEntry(false);$('#backFromEditor').onclick=()=>{if(title.value.trim()||body.value.trim())saveEntry(false);navigate(currentId?'entries':'home')};
 $('#favoriteToggle').onclick=()=>{const old=state.entries.find(e=>e.id===currentId);if(old){old.favorite=!old.favorite;persist();render()}else{saveEntry(false);const e=state.entries.find(e=>e.id===currentId);if(e){e.favorite=true;persist();render()}}};
 $$('[data-mood]').forEach(b=>b.onclick=()=>{activeMood=b.dataset.mood;$$('[data-mood]').forEach(x=>x.classList.toggle('selected',x===b));schedule()});
 $('#entryDate').onchange=schedule;
 $('#addTag').onclick=addTag;$('#tagInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addTag()}};
 function addTag(){const input=$('#tagInput');const tag=input.value.trim().replace(/^#/,'').slice(0,24);if(tag&&!editorTags.some(t=>t.toLowerCase()===tag.toLowerCase()))editorTags.push(tag);input.value='';refreshTags();schedule()}
 function refreshTags(){$('#tagList').innerHTML=editorTags.map(t=>`<span class="tag-chip">${esc(t)} <button data-remove-tag="${esc(t)}" style="border:0;background:none;color:inherit;padding:0">×</button></span>`).join('');$$('[data-remove-tag]').forEach(b=>b.onclick=()=>{editorTags=editorTags.filter(t=>t!==b.dataset.removeTag);refreshTags();schedule()})}
 $$('[data-remove-tag]').forEach(b=>b.onclick=()=>{editorTags=editorTags.filter(t=>t!==b.dataset.removeTag);refreshTags();schedule()});
 $$('[data-format]').forEach(b=>b.onclick=()=>formatText(b.dataset.format));
 function formatText(kind){const start=body.selectionStart,end=body.selectionEnd,selected=body.value.slice(start,end)||'your text';let insert=selected,a=start,z=end;if(kind==='bold')insert='**'+selected+'**';if(kind==='italic')insert='_'+selected+'_';if(kind==='heading')insert='# '+selected;if(kind==='quote')insert='> '+selected;if(kind==='bullet')insert='• '+selected;if(kind==='rule')insert='\n────────────\n';body.setRangeText(insert,start,end,'select');body.focus();schedule()}
 $('#clearFormatting').onclick=()=>{body.value=body.value.replace(/\*\*(.*?)\*\*/g,'$1').replace(/_(.*?)_/g,'$1').replace(/^# |^> |^• /gm,'');schedule();toast('Basic formatting markers removed')};
 $('#exportSingle').onclick=()=>{const d=getEditorData();download(`${d.title||'journal-entry'}.txt`,`${d.title}\n${prettyDate(d.date)}\nMood: ${d.mood}\nTags: ${d.tags.join(', ')}\n\n${d.body}`,'text/plain;charset=utf-8')};
 const del=$('#deleteEntry');if(del)del.onclick=()=>confirmModal('Delete this entry?','This entry will be permanently removed from this browser. Export a backup first if you want to keep it.',()=>{state.entries=state.entries.filter(e=>e.id!==currentId);persist();toast('Entry deleted');navigate('entries')});
 updateEditorCount();
}
function bindSettings(){
 $$('[data-theme-pick]').forEach(b=>b.onclick=()=>{state.settings.theme=b.dataset.themePick;persist();render();toast('Theme updated')});
 $('#fontSelect').onchange=e=>{state.settings.font=e.target.value;persist();applySettings();$('#fontPreview').style.fontFamily=getComputedStyle(document.body).getPropertyValue('--body-font')};
 $('#fontSize').oninput=e=>{state.settings.size=+e.target.value;$('#sizeLabel').textContent=e.target.value+'px';document.documentElement.style.setProperty('--editor-size',e.target.value+'px');persist()};
 $('#autosaveToggle').onchange=e=>{state.settings.autosave=e.target.checked;persist();toast('Autosave '+(e.target.checked?'enabled':'disabled'))};
 $('#wordToggle').onchange=e=>{state.settings.showWordCount=e.target.checked;persist();toast('Word count preference saved')};
 $('#compactToggle').onchange=e=>{state.settings.compact=e.target.checked;document.body.classList.toggle('compact',e.target.checked);persist();toast('Preference saved')};
 $('#exportBackup').onclick=()=>download('liquidjournal-backup-'+dateKey()+'.json',JSON.stringify({app:'LiquidJournal',version:1,exportedAt:nowISO(),entries:state.entries,settings:state.settings},null,2),'application/json');
 $('#exportMarkdown').onclick=()=>{const md=[`# LiquidJournal export`,`Exported ${prettyDate(nowISO())}`,'',...state.entries.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(e=>`## ${e.title||'Untitled entry'}\n\n_${prettyDate(e.date)} · ${e.mood||'🙂'} · ${(e.tags||[]).map(t=>'#'+t).join(' ')}_\n\n${e.body||''}\n\n---`) ].join('\n');download('liquidjournal-export.md',md,'text/markdown;charset=utf-8')};
 $('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());const entries=Array.isArray(obj)?obj:obj.entries;if(!Array.isArray(entries))throw Error('No entries found');const valid=entries.filter(x=>x&&typeof x==='object'&&typeof x.id==='string');const map=new Map(state.entries.map(x=>[x.id,x]));valid.forEach(x=>map.set(x.id,{...x,tags:Array.isArray(x.tags)?x.tags:[]}));state.entries=[...map.values()];if(obj.settings)state.settings={...state.settings,...obj.settings};persist();render();toast(`Imported ${valid.length} entr${valid.length===1?'y':'ies'}`)}catch(err){toast('Could not import that file. Choose a LiquidJournal JSON backup.')}e.target.value=''};
 $('#clearAll').onclick=()=>confirmModal('Clear all journal data?','This permanently deletes every entry saved in this browser. Export a JSON backup first if there is anything you want to keep.',()=>{state.entries=[];persist();render();toast('Journal cleared')});
}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name.replace(/[\\/:*?"<>|]/g,'-');document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Your file is ready')}
function confirmModal(title,desc,onYes){$('#modalRoot').innerHTML=`<div class="modal-backdrop" role="presentation"><section class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">${esc(title)}</h2><p>${esc(desc)}</p><div class="modal-actions"><button class="soft-btn" id="modalCancel">Cancel</button><button class="primary" id="modalConfirm">Continue</button></div></section></div>`;$('#modalCancel').onclick=()=>$('#modalRoot').innerHTML='';$('#modalConfirm').onclick=()=>{$('#modalRoot').innerHTML='';onYes()};$('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))$('#modalRoot').innerHTML=''}}
$('#newEntry').onclick=()=>openEditor();$('#mobileNew').onclick=()=>openEditor();
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
$('#settingsQuick').onclick=()=>navigate('settings');
$('#themeQuick').onclick=()=>{state.settings.theme=state.settings.theme==='dark'?'liquid':'dark';persist();render();toast(state.settings.theme==='dark'?'Dark theme enabled':'Liquid Glass theme enabled')};
$('#quickSearch').onclick=()=>{navigate('entries');setTimeout(()=>$('#entrySearch')?.focus(),50)};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&view==='editor')saveEntry(false);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();navigate('entries');setTimeout(()=>$('#entrySearch')?.focus(),50)}if(e.key==='Escape'&&$('#modalRoot').innerHTML)$('#modalRoot').innerHTML=''});
const quotes=['You do not have to understand everything today. Just begin where you are.','Small steps still move you forward.','Your mind deserves the same kindness you give to others.','You are allowed to grow at your own pace.','A thought written down is a thought you can meet with clarity.','Rest is part of the rhythm, not a break from it.','You can be a work in progress and still be proud of yourself.','Notice what is working, not only what needs fixing.'];
$('#quoteRefresh').onclick=()=>{$('#dailyQuote').textContent=quotes[Math.floor(Math.random()*quotes.length)]};
// Progressive Web App: install prompt where supported, with friendly fallback guidance.
let deferredInstallPrompt=null;
const installButton=$('#installApp');
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
if(isStandalone() && installButton) installButton.classList.add('hidden');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;if(installButton)installButton.classList.remove('hidden')});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;if(installButton)installButton.classList.add('hidden');toast('LiquidJournal installed successfully')});
if(installButton)installButton.addEventListener('click',async()=>{
 if(isStandalone()){toast('LiquidJournal is already installed');return}
 if(deferredInstallPrompt){deferredInstallPrompt.prompt();const result=await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;if(result.outcome==='accepted'){installButton.classList.add('hidden')}else{toast('You can install LiquidJournal whenever you are ready')}return}
 const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
 if(isIOS)toast('To install: tap Share in Safari, then “Add to Home Screen”.');
 else if(!window.isSecureContext)toast('Install is available after deploying with HTTPS (for example, Vercel).');
 else toast('Open your browser menu and choose “Install app” or “Add to Home screen”.');
});
if('serviceWorker' in navigator && location.protocol!=='file:'){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(err=>console.warn('LiquidJournal offline support could not start:',err)));
}
render();
})();
</script>
</body>
</html>
